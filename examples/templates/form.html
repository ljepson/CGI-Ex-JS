<!DOCTYPE html>
<html>
<head>
    <title><%= title %></title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        textarea {
            height: 100px;
            resize: vertical;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        .error {
            color: red;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1><%= title %></h1>
    <p><%= message %></p>

    <form method="POST" action="/process">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" value="<%= name || '' %>">
            <% if (name_error) { %>
                <div class="error"><%= name_error %></div>
            <% } %>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="<%= email || '' %>">
            <% if (email_error) { %>
                <div class="error"><%= email_error %></div>
            <% } %>
        </div>

        <div class="form-group">
            <label for="message">Message:</label>
            <textarea id="message" name="message"><%= message || '' %></textarea>
            <% if (message_error) { %>
                <div class="error"><%= message_error %></div>
            <% } %>
        </div>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
